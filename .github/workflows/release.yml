# Release @speedle/mcp from a `vX.Y.Z` tag on a commit of `main`; see
# RELEASING.md.
#
# A pushed `vX.Y.Z` tag runs:
#   preflight  the release environment is readable
#   verify     tag format, commit on main, tag version == package metadata
#   build      build, unit tests, package smoke test and the package artifact;
#              no secrets and no OIDC token
#   publish    in the `release` environment, publishes the artifact built by
#              `build` with `npm publish --provenance --access public` through
#              trusted publishing (OIDC). The job fails if NPM_STAGE_TOKEN or
#              NPM_BOOTSTRAP_TOKEN is set. After that publish succeeds, it
#              publishes server.json to the MCP Registry with
#              `mcp-publisher login github-oidc` (same OIDC permission, no
#              registry secret).
#
# There is no pull_request or workflow_run trigger, so PR code never runs here.
# Caches are off so a release never restores state written by another run.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check release environment protection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # required to read environment protection rules
    steps:
      - name: Release environment exists and is readable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/environments/release" > /dev/null; then
            echo "::error::The release environment is missing or unreadable. Create it before releasing (RELEASING.md, Owner setup on GitHub)."
            exit 1
          fi
          echo "The release environment exists and is readable"

  verify:
    name: Verify release request
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Release commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "::error::release commit $GITHUB_SHA is not on main"
            exit 1
          }
          echo "$GITHUB_SHA is on main"
      - name: Requested version matches the package metadata
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs "$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test the package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build and package smoke test
        run: npm run test:package
      - name: Pack
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/dist"
          test -f "$RUNNER_TEMP/dist/speedle-mcp-$VERSION.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish @speedle/mcp on npm
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The top-level group is per tag, so two tag runs can proceed at the same
    # time. One shared group serializes the publish jobs.
    concurrency:
      group: publish-mcp
      cancel-in-progress: false
    environment:
      name: release
      url: https://www.npmjs.com/package/@speedle/mcp/v/${{ needs.verify.outputs.version }}
    permissions:
      id-token: write # npm trusted publishing and MCP Registry GitHub OIDC
      contents: read # server.json for the registry publish
    steps:
      # Fail before any publish if an npm token secret is present. Trusted
      # publishing authenticates with OIDC only; a token must not be able to
      # come back and take over the release (RELEASING.md).
      - name: Refuse npm token secrets
        env:
          NPM_STAGE_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          failed=0
          if [ -n "$NPM_STAGE_TOKEN" ]; then
            echo "::error::NPM_STAGE_TOKEN is set on the release environment. Delete it so releases use trusted publishing only (RELEASING.md)."
            failed=1
          fi
          if [ -n "$NPM_BOOTSTRAP_TOKEN" ]; then
            echo "::error::NPM_BOOTSTRAP_TOKEN is set on the release environment. Delete it so releases use trusted publishing only (RELEASING.md)."
            failed=1
          fi
          exit "$failed"
      # No `registry-url` here. With it, setup-node (src/authutil.ts in v7.1.0)
      # always writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` to
      # $RUNNER_TEMP/.npmrc and points NPM_CONFIG_USERCONFIG at it, so an unset
      # or empty NODE_AUTH_TOKEN still leaves an (empty) _authToken entry. npm
      # tries OIDC first and falls back to that configured token
      # (https://docs.npmjs.com/trusted-publishers), and its OIDC code
      # (lib/utils/oidc.js) returns quietly on a failed exchange, so a broken
      # trust setup would surface as a misleading auth error. Trusted
      # publishing needs no token, and npm's default registry is
      # registry.npmjs.org.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))); process.exit(ok ? 0 : 1)' "$(npm --version)" || {
            echo "::error::trusted publishing needs npm 11.5.1 or later; this workflow uses Node 24"
            exit 1
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-dist
          path: dist
      # A re-run after npm publish succeeded must still reach the registry
      # step. npm refuses to replace a version, so skip only when that exact
      # version is already on npm.
      - name: npm publish
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          published="$(npm view "@speedle/mcp@$VERSION" version --registry https://registry.npmjs.org/ 2>/dev/null || true)"
          if [ "$published" = "$VERSION" ]; then
            echo "@speedle/mcp@$VERSION is already on npm; continuing to the MCP Registry publish"
          else
            npm publish "./dist/speedle-mcp-$VERSION.tgz" --provenance --access public --ignore-scripts --registry https://registry.npmjs.org/
          fi
      - name: Checkout server.json
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
      - name: Record the published release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "## Published @speedle/mcp@$VERSION"
            echo
            echo "Published with \`npm publish --provenance --access public\` through trusted publishing."
            echo
            echo "Published \`io.github.teramoby/speedle-mcp\` version \`$VERSION\` to the MCP Registry."
            echo
            echo "Verify:"
            echo
            echo '```sh'
            echo "npm view @speedle/mcp@$VERSION version dist.integrity dist.attestations"
            echo "curl \"https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.teramoby/speedle-mcp\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
